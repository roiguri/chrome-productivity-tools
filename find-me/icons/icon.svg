<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="14" y1="10" x2="98" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#3367D6"/>
    </linearGradient>
    <clipPath id="lensClip">
      <circle cx="50" cy="50" r="38"/>
    </clipPath>
  </defs>

  <!-- Whole magnifier is scaled up and re-centered so it fills the canvas
       with even margins instead of sitting high-left with empty space below. -->
  <g transform="translate(64 64) scale(1.2) translate(-52.75 -52.75)">
    <!-- handle (drawn first so the lens ring caps it cleanly) -->
    <line x1="78" y1="78" x2="94" y2="94" stroke="url(#grad)" stroke-width="16" stroke-linecap="round"/>

    <!-- lens glass -->
    <circle cx="50" cy="50" r="38" fill="#EAF2FF"/>

    <!-- person framed in the lens -->
    <g clip-path="url(#lensClip)" fill="url(#grad)">
      <circle cx="50" cy="40" r="13"/>
      <circle cx="50" cy="79" r="21"/>
    </g>

    <!-- lens ring -->
    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad)" stroke-width="13"/>
  </g>
</svg>
