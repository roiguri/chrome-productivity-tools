<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Find Me</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 350px;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    h1 {
      font-size: 18px;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #4285F4;
    }
    button {
      background-color: #4285F4;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-bottom: 8px;
    }
    button:hover {
      background-color: #3367d6;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    input[type="file"] {
      width: 100%;
      padding: 6px 0;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .section {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }
    .hidden {
      display: none;
    }
    .error {
      color: #d93025;
      font-size: 12px;
      margin-top: 4px;
    }
    .status {
      font-size: 13px;
      color: #5f6368;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" width="24" height="24"> Find Me</h1>

  <div class="section">
    <label for="reference-photos"><strong>1. Add Reference Photos of Your Face</strong></label>
    <p style="font-size: 12px; color: #666; margin-top: 4px;">Choose up to 5 clear photos of your face. They're stored locally in your browser and never uploaded anywhere.</p>
    <input type="file" id="reference-photos" accept="image/*" multiple>
    <div id="reference-status" class="status"></div>
  </div>

  <div class="section">
    <label><strong>2. Scan Current Page</strong></label>
    <button id="scan-btn" disabled>Scan This Page</button>
    <div id="scan-status" class="status"></div>
  </div>

  <div class="section" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
    <label><strong>Google Photos (optional)</strong></label>
    <p style="font-size: 12px; color: #666; margin-top: 4px;">Sign in to enable "Save to Photos" on matches found during a scan.</p>
    <button id="auth-btn">Sign in with Google</button>
    <div id="auth-status" class="status"></div>
    <div id="auth-error" class="error hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
