<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Find Me</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 350px;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    h1 {
      font-size: 18px;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #4285F4;
    }
    button {
      background-color: #4285F4;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-bottom: 8px;
    }
    button:hover {
      background-color: #3367d6;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    /* Hide the native file input; a styled label drives it instead. */
    input[type="file"].visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      border: 0;
    }
    .file-button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      padding: 8px 12px;
      border: 1px solid #4285F4;
      border-radius: 4px;
      background: #fff;
      color: #4285F4;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }
    .file-button:hover {
      background: #f5f9ff;
    }
    .section {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }
    .hidden {
      display: none;
    }
    .error {
      color: #d93025;
      font-size: 12px;
      margin-top: 4px;
    }
    .status {
      font-size: 13px;
      color: #5f6368;
      margin-top: 8px;
    }
    .thumb-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 0;
    }
    .thumb {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #ddd;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb .thumb-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      padding: 0;
      margin: 0;
      line-height: 14px;
      font-size: 12px;
      font-weight: bold;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      cursor: pointer;
    }
    .thumb .thumb-remove:hover {
      background: rgba(0, 0, 0, 0.85);
    }
    .thumb .thumb-badge {
      position: absolute;
      bottom: 2px;
      left: 2px;
      min-width: 16px;
      height: 16px;
      padding: 0 3px;
      line-height: 16px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      border-radius: 8px;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" width="24" height="24"> Find Me</h1>

  <div class="section">
    <div><strong>1. Add Reference Photos of Your Face</strong></div>
    <p style="font-size: 12px; color: #666; margin-top: 4px;">Choose up to 5 clear photos of your face. They're stored locally in your browser and never uploaded anywhere.</p>
    <input type="file" id="reference-photos" accept="image/*" multiple class="visually-hidden">
    <label for="reference-photos" class="file-button">＋ Add photos</label>
    <div id="reference-thumbs" class="thumb-grid"></div>
    <div id="reference-status" class="status"></div>
  </div>

  <div class="section">
    <label><strong>2. Scan Current Page</strong></label>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#666;font-weight:normal;margin:6px 0;">
      <input type="checkbox" id="auto-scroll" style="width:auto;margin:0;"> Auto-scroll to load more photos while scanning
    </label>
    <label style="display:block;font-size:12px;color:#666;margin:10px 0 2px;">
      Match strictness: <strong id="sens-label" style="color:#4285F4;">Balanced</strong>
    </label>
    <input type="range" id="sensitivity" min="0.45" max="0.70" step="0.05" value="0.60" style="width:100%;margin:0;padding:0;cursor:pointer;">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#999;margin-bottom:8px;">
      <span>Stricter · fewer, surer</span><span>Looser · more, riskier</span>
    </div>
    <button id="scan-btn" disabled>Scan This Page</button>
    <div id="scan-status" class="status"></div>
  </div>

  <div class="section" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
    <label><strong>Google Photos (optional)</strong></label>
    <p style="font-size: 12px; color: #666; margin-top: 4px;">Sign in to enable "Save to Photos" on matches found during a scan.</p>
    <button id="auth-btn">Sign in with Google</button>
    <div id="auth-status" class="status"></div>
    <div id="auth-error" class="error hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
